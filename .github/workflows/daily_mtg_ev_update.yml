name: Daily MTG Booster EV & Pricing Pipeline

on:
  schedule:
    # Runs daily at 04:00 UTC (12:00 AM EST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual one-click runs from GitHub Actions UI
    inputs:
      audit_enabled:
        description: 'Capture raw booster samples and bucket audit files'
        required: false
        type: boolean
        default: false
      quick_test_limit:
        description: 'Quick test mode: limit booster simulation & live price sync to N sets/products (blank = full run). Never publishes to data-sync or Vercel.'
        required: false
        type: string
        default: ''
      quick_test_set:
        description: 'Optional set code for quick test mode (for example MKM). Leave blank to use the first N records.'
        required: false
        type: string
        default: ''
      publish_quick_test:
        description: 'Publish a quick-test result to a Vercel preview branch (never production). Requires quick_test_set or quick_test_limit.'
        required: false
        type: boolean
        default: false

jobs:
  update-ev-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    # Provision temporary MySQL service for zero database hosting costs
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_for_cards
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MySQL Client & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          pip install mysql-connector-python requests tqdm numpy

      - name: Prepare Isolated Pipeline Workspace
        run: |
          set -e
          rm -rf ../mtgev-pipeline-workspace
          mkdir -p ../mtgev-pipeline-workspace
          rsync -a --exclude='.git' --exclude='node_modules' ./ ../mtgev-pipeline-workspace/

      - name: Execute Daily Update Pipeline & JSON Export
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_NAME: test_for_cards
          AUDIT_ENABLED: ${{ inputs.audit_enabled }}
          AUDIT_OUTPUT_DIR: backend/audit_output
          QUICK_TEST_LIMIT: ${{ inputs.quick_test_limit }}
          QUICK_TEST_SET: ${{ inputs.quick_test_set }}
        run: |
          set -e
          cd ../mtgev-pipeline-workspace
          python backend/daily_update.py

      - name: Stage Validated Generated Data
        run: |
          set -e
          rm -rf backend/audit_output
          if [ -d ../mtgev-pipeline-workspace/backend/audit_output ]; then
            cp -a ../mtgev-pipeline-workspace/backend/audit_output backend/audit_output
          fi
          mv public/data public/data.previous
          if mv ../mtgev-pipeline-workspace/public/data public/data; then
            rm -rf public/data.previous
          else
            mv public/data.previous public/data
            exit 1
          fi

      - name: Report EV audit output
        run: |
          if [ -d backend/audit_output ]; then
            echo "Audit directory contents:"
            find backend/audit_output -maxdepth 1 -type f -print | sort
          else
            echo "No backend/audit_output directory was produced. audit_enabled=${{ inputs.audit_enabled }}"
          fi

      - name: Verify EV audit output exists
        if: ${{ inputs.audit_enabled == true }}
        run: |
          set -e
          test -d backend/audit_output
          test -n "$(find backend/audit_output -maxdepth 1 -type f -name '*.json' -print -quit)"

      - name: Verify deployable generated data bundle
        run: |
          set -e
          test -s public/data/product_chase_cards.json
          test -s public/data/latest_pipeline_run.json
          test -s public/data/pipeline_execution_logs.json

      - name: Upload EV audit files
        if: ${{ inputs.audit_enabled == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ev-simulation-audit-${{ github.run_number }}
          path: backend/audit_output/
          if-no-files-found: error
          retention-days: 7

      - name: Commit & Push Updated Datasets to Dedicated Data Branch
        if: ${{ (!inputs.quick_test_limit && !inputs.quick_test_set) || inputs.publish_quick_test }}
        env:
          QUICK_TEST_LIMIT: ${{ inputs.quick_test_limit }}
          QUICK_TEST_SET: ${{ inputs.quick_test_set }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "${QUICK_TEST_SET}" ]; then
            TARGET_BRANCH="quick-test-${QUICK_TEST_SET,,}"
          elif [ -n "${QUICK_TEST_LIMIT}" ]; then
            TARGET_BRANCH="quick-test-limit-${QUICK_TEST_LIMIT}"
          else
            TARGET_BRANCH="data-sync"
          fi
          git checkout -B "$TARGET_BRANCH"
          git add -f \
            public/data/sets.json \
            public/data/sealed_products.json \
            public/data/booster_ev.json \
            public/data/arbitrage_leaderboard.json \
            public/data/single_card_prices.json \
            public/data/pricing_reliability.json \
            public/data/product_chase_cards.json \
            public/data/precon_decks.json \
            public/data/pipeline_execution_logs.json \
            public/data/latest_pipeline_run.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update MTG booster EV & market prices [skip ci]"
            git push origin "$TARGET_BRANCH" --force
          fi
          # Full runs target production data-sync; quick tests target Vercel preview branches.
